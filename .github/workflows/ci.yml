name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # The build must succeed without any real credentials. Placeholder values
      # satisfy env validation; nothing here reaches a real service, and no
      # secret is required to prove the app compiles.
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  migrations:
    name: Validate database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Applies every migration to a real PostgreSQL 17 server and asserts the
      # security invariants: RLS on every table, no policies on
      # plaid_item_secrets, no browser write access to Plaid-owned columns.
      - name: Install PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-contrib-17

      - name: Apply migrations
        run: PG_BIN=/usr/lib/postgresql/17/bin ./scripts/validate-migrations.sh

  secret-scan:
    name: Check for committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-no-secrets.sh
